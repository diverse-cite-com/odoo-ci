affinity: {}
checkInterval: 3
concurrent: 10
configMaps: {}
deploymentAnnotations: {}
deploymentLabels: {}
deploymentLifecycle: {}
extraContainers: []
extraEnv: {}
extraEnvFrom: {}
extraObjects: []
hostAliases: []
image:
  image: gitlab-org/gitlab-runner
  registry: registry.gitlab.com
imagePullPolicy: IfNotPresent
livenessProbe: {}
metrics:
  enabled: false
  port: 9252
  portName: metrics
  serviceMonitor:
    enabled: false
nodeSelector: {}
podAnnotations: {}
podLabels: {}
podSecurityContext:
  fsGroup: 65533
  runAsUser: 100
priorityClassName: ''
rbac:
  clusterWideAccess: false
  create: true
  generatedServiceAccountName: ''
  imagePullSecrets: []
  podSecurityPolicy:
    enabled: true
    resourceNames:
      - gitlab-runner
  rules:
    - apiGroups: [""]
      resources: ["pods", "pods/exec", "pods/attach"]
      verbs: ["get", "list", "watch", "create", "patch", "delete", "update"]
    - apiGroups: [""]
      resources: ["secrets"]
      verbs: ["get", "create", "delete", "update", "patch"]
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["get", "list", "watch", "create"]
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["services"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["persistentvolumeclaims"]
      verbs: ["get", "list", "watch", "create", "delete"]
    - apiGroups: ["policy"]
      resources: ["podsecuritypolicies"]
      verbs: ["use"]
      resourceNames: ["gitlab-runner"]
  serviceAccountAnnotations: {}
readinessProbe: {}
resources: {}
runners:
  # NOTE: the LIVE release (Rancher Apps & Marketplace, helm chart 0.85.0) also
  # carries `runnerToken` and Rancher `global.cattle.*` values that are NOT in
  # this file. Apply changes via `helm upgrade --reuse-values -f <override>` or
  # through Rancher — never a bare `helm upgrade -f gitlab-runner-values.yaml`,
  # which would drop the token and break runner registration. This file mirrors
  # the live runner config for documentation/source-of-truth.
  cache:
    # S3 cache backend (MinIO). Creds come from this secret's accesskey/secretkey
    # (the chart exports them as CACHE_S3_ACCESS_KEY/SECRET_KEY).
    secretName: gitlab-runner-cache-s3
  config: |
    [[runners]]
      [runners.kubernetes]
        namespace = "{{.Release.Namespace}}"
        image = "alpine"
        privileged = true
        allowed_pull_policies = ["always", "if-not-present", "never"]
        allowed_services = ["docker:*", "postgres:*"]
        poll_timeout = 600
        poll_interval = 5
        service_account_overwrite_allowed = "true"
        service_account = "gitlab-runner"
        pull_policy = "always"
        # For build containers
        ephemeral_storage_limit = "10Gi"
        ephemeral_storage_request = "2Gi"
        # For helper containers
        helper_ephemeral_storage_limit = "2Gi"
        helper_ephemeral_storage_request = "1Gi"
        # For service containers
        service_ephemeral_storage_limit = "10Gi"
        service_ephemeral_storage_request = "512Mi"
        [runners.kubernetes.pod_annotations]
          "cluster-autoscaler.kubernetes.io/safe-to-evict" = "true"
        [runners.kubernetes.affinity]
          [[runners.kubernetes.affinity.node_affinity.preferred_during_scheduling_ignored_during_execution]]
            weight = 100
            [runners.kubernetes.affinity.node_affinity.preferred_during_scheduling_ignored_during_execution.preference]
              [[runners.kubernetes.affinity.node_affinity.preferred_during_scheduling_ignored_during_execution.preference.match_expressions]]
                key = "bemade.org/compute"
                operator = "In"
                values = ["true"]
      [runners.cache]
        Type = "s3"
        Shared = true
        [runners.cache.s3]
          ServerAddress = "minio-api.bemade.org"
          BucketName = "gitlab-runner-cache"
          BucketLocation = "us-east-1"
          Insecure = false
  configPath: ''
runtimeClassName: ''
secrets: []
# Security context for the GitLab Runner pod itself
# The DinD service has its own security context defined in the runners.kubernetes config
securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
service:
  enabled: false
  type: ClusterIP
serviceAccount:
  annotations: {}
  imagePullSecrets:
    - name: docker.bemade.org
  name: 'gitlab-runner'
sessionServer:
  enabled: false
  ingress:
    annotations: {}
    className: ''
    enabled: false
    tls:
      - secretName: gitlab-runner-session-server
  serviceType: LoadBalancer
shutdown_timeout: 0
strategy: {}
terminationGracePeriodSeconds: 3600
tolerations: []
topologySpreadConstraints: {}
unregisterRunners: true
useTini: false
volumeMounts: []
volumes: []
gitlabUrl: https://git.bemade.org
global:
  cattle:
    systemProjectId: p-b4p8r
