apiVersion: batch/v1
kind: Job
metadata:
  name: odoo-ci-build
  labels:
    app: odoo-ci
spec:
  ttlSecondsAfterFinished: 86400  # Clean up job after 1 day
  template:
    metadata:
      labels:
        app: odoo-ci
    spec:
      # Use a shared volume for both containers
      volumes:
        - name: workspace
          emptyDir: {}
        - name: docker-config
          secret:
            secretName: harbor-credentials
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: ssh-key
          secret:
            secretName: github-ssh-key
            defaultMode: 0600
            items:
              - key: ssh-privatekey
                path: github_key
      
      # Init container to prepare the build environment
      initContainers:
        - name: git-clone-prepare
          image: alpine/git:latest
          workingDir: /workspace
          command:
            - /bin/sh
            - -c
            - |
              # Set up SSH
              mkdir -p /root/.ssh
              cp /ssh-keys/github_key /root/.ssh/id_rsa
              chmod 600 /root/.ssh/id_rsa
              
              # Configure SSH to not verify host keys
              cat > /root/.ssh/config << EOF
              Host github.com
                StrictHostKeyChecking no
                UserKnownHostsFile=/dev/null
              
              Host git.bemade.org
                StrictHostKeyChecking no
                UserKnownHostsFile=/dev/null
              EOF
              
              # Clone the repository
              git clone ${GIT_REPOSITORY_URL} .
              
              # Update submodules
              git submodule update --init --recursive --recommend-shallow
              
              # Get the standard dockerfile
              git clone git@git.bemade.org:bemade/odoo-ci.git
              
              # Convert symlinks in ./addons to full folders
              if [ -d "./addons" ] && [ "$(ls -A ./addons)" ]; then
                mkdir -p ./addons-new
                cd ./addons-new
                find ../addons -type l -exec sh -c 'target=$(readlink {}); link_name=$(basename {}); cp -r ${target#./} $link_name; rm {}' \;
                cd ..
                if [ "$(ls -A ./addons-new)" ]; then
                  cp -r ./addons-new/* ./addons/
                  rm -rf addons-new
                fi
              fi
              
              # Create a file to signal completion
              touch /workspace/.init-complete
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: ssh-key
              mountPath: /ssh-keys
          env:
            - name: GIT_REPOSITORY_URL
              value: ${GIT_REPOSITORY_URL}
            - name: ODOO_VERSION
              value: ${ODOO_VERSION}
            - name: COMMUNITY
              value: ${COMMUNITY}
      
      # Main container using Kaniko to build the image
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.9.1
          workingDir: /workspace
          args:
            - --context=/workspace
            - --dockerfile=/workspace/odoo-ci/Dockerfile
            - --destination=${CONTAINER_IMAGE}:${BUILD_DATE}
            - --destination=${CONTAINER_IMAGE}:latest
            - --cleanup
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: docker-config
              mountPath: /kaniko/.docker
          env:
            - name: BUILD_DATE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.creationTimestamp
                  # Format this as YYYY-MM-DD in a real implementation
            - name: CONTAINER_IMAGE
              value: ${HARBOR_HOST}/bemade/${CI_PROJECT_NAMESPACE}-${CI_PROJECT_NAME}-${CI_COMMIT_BRANCH}
            - name: ODOO_VERSION
              value: ${ODOO_VERSION}
          # Wait for init container to complete
          command:
            - /bin/sh
            - -c
            - |
              # Wait for init container to complete
              while [ ! -f /workspace/.init-complete ]; do
                echo "Waiting for init container to complete..."
                sleep 5
              done
              
              # Determine which Dockerfile to use
              if [ "${COMMUNITY}" = "true" ]; then
                DOCKERFILE="/workspace/odoo-ci/Dockerfile-community"
              else
                DOCKERFILE="/workspace/odoo-ci/Dockerfile"
              fi
              
              # Run Kaniko
              /kaniko/executor \
                --context=/workspace \
                --dockerfile=${DOCKERFILE} \
                --build-arg=ODOO_VERSION=${ODOO_VERSION} \
                --destination=${CONTAINER_IMAGE}:${BUILD_DATE} \
                --destination=${CONTAINER_IMAGE}:latest \
                --cleanup
      
      restartPolicy: Never
