# Set ALLOWED_BRANCHES in your project's .gitlab-ci.yml to specify which branches should trigger this workflow
# Format: re2 regex, see https://github.com/google/re2 

variables:
  # Strip :443 from registry URL to match pull secret configuration
  CONTAINER_IMAGE: "${CI_REGISTRY_IMAGE}/odoo-$CI_COMMIT_BRANCH"
stages:
  - build
  - test
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ $ALLOWED_BRANCHES
      when: always
    - when: never

build:
  stage: build
  tags: [kubernetes]
  image: docker:20.10.16
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ $ALLOWED_BRANCHES
      when: always
    - when: never
  services:
    - name: docker:20.10.16-dind
      alias: docker
      command: ["--tls=false", "--host=tcp://0.0.0.0:2375"]
  variables:
    # When using dind service, we need to instruct docker to talk with it
    DOCKER_HOST: tcp://docker:2375
    # These settings ensure docker can communicate with the dind service
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    # Pass registry credentials to Docker
    DOCKER_AUTH_CONFIG: '{"auths":{"${CI_REGISTRY}":{"username":"${CI_DEPLOY_USER}","password":"${CI_DEPLOY_PASSWORD}"}}}'
  script:
    - |
      set -x

      # Validate essential environment variables
      if [ -z "$CI_REGISTRY" ] || [ -z "$CI_DEPLOY_USER" ] || [ -z "$CI_DEPLOY_PASSWORD" ]; then
        echo "ERROR: Missing required Docker registry credentials"
        exit 1
      fi
      
      # Check docker is running or fail fast
      docker image ls

      # Login to Docker registry or fail fast
      echo "${CI_DEPLOY_PASSWORD}" | docker login ${CI_REGISTRY} -u "${CI_DEPLOY_USER}" --password-stdin
      
      # Install git and ssh
      apk add --no-cache git openssh-client bash shadow

      # Create a non-root user for better security
      addgroup -g 1000 builder
      adduser -D -u 1000 -G builder builder
      mkdir -p /home/builder
      chown -R builder:builder /home/builder

      # Set up SSH for GitHub access
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh

      # Configure SSH to not verify host keys
      cat > ~/.ssh/config << EOF
      Host github.com
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null

      Host git.bemade.org
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null
      EOF
      chmod 600 ~/.ssh/config

      # Add the SSH key - copy from the CI/CD variable
      cp "$SSH_KEY_GITHUB" ~/.ssh/github_key
      chmod 600 ~/.ssh/github_key
      eval $(ssh-agent -s)
      ssh-add ~/.ssh/github_key

      # Clone submodules
      git submodule update --init --recursive --recommend-shallow

      # Get the standard dockerfile
      git clone git@git.bemade.org:bemade/odoo-ci.git

      # Determine which dockerfile to use
      if [[ $COMMUNITY ]]; then
        dockerfile="odoo-ci/Dockerfile-community"
      else
        dockerfile="odoo-ci/Dockerfile"
      fi

      # Prepare the build context
      if [ -f ".odoo-deploy/odoo-ci/prepare-build.sh" ]; then
        bash .odoo-deploy/odoo-ci/prepare-build.sh
      fi

      # Convert symlinks in ./addons to full folders
      home="$(pwd)"
      if [ -d "./addons" ] && [ "$(ls -A ./addons)" ]; then
        mkdir -p ./addons-new \
        && cd ./addons-new \
        && find ../addons -type l \
          -exec sh -c 'target=$(readlink {}); link_name=$(basename {}); mv ${target#./} $link_name; rm {}' \;
      fi

      cd "$home"
      if [ -d "./addons-new" ] && [ "$(ls -A ./addons-new)" ]; then
        mv -f ./addons-new/* ./addons/ \
          && rm -rf addons-new
      fi

      # Set build date
      BUILD_DATE=$(date +%Y-%m-%d)

      # Ensure optional files exist (empty is fine, Dockerfile handles it)
      touch requirements.txt build-packages.txt runtime-packages.txt

      # Build the Docker image with date and latest tags
      docker build \
        --no-cache \
        -f "${dockerfile}" \
        --build-arg ODOO_VERSION=${ODOO_VERSION} \
        --build-arg REGISTRY=${CI_REGISTRY} \
        -t "${CONTAINER_IMAGE}:${BUILD_DATE}" \
        -t "${CONTAINER_IMAGE}:latest" \
        --target production \
        .

      # Build the test target with pytest-odoo
      docker build \
        -f "${dockerfile}" \
        --build-arg ODOO_VERSION=${ODOO_VERSION} \
        --build-arg REGISTRY=${CI_REGISTRY} \
        -t "${CONTAINER_IMAGE}:${BUILD_DATE}-test" \
        -t "${CONTAINER_IMAGE}:test" \
        --target test \
        .

      # Push the production image with date and latest tags
      docker push "${CONTAINER_IMAGE}:${BUILD_DATE}"
      docker push "${CONTAINER_IMAGE}:latest" | tee push_output.txt

      # Push the test image
      docker push "${CONTAINER_IMAGE}:${BUILD_DATE}-test"
      docker push "${CONTAINER_IMAGE}:test"

      grep "digest:" push_output.txt | cut -d' ' -f3 > image-digest.txt

  # Save the image digest as an artifact for the deploy job
  artifacts:
    paths:
      - image-digest.txt
    expire_in: 1 hour

# Test stage - runs Odoo tests on changed modules
# Set TEST_ENABLED=true in your project's .gitlab-ci.yml to enable testing
# Set TEST_INCLUDE_CODEPENDS=true to also test modules that depend on changed modules
# Set TEST_DATABASE=<name> to specify test database name (default: test_ci)
test:
  stage: test
  tags: [kubernetes]
  image: docker:20.10.16
  needs: ["build"]
  dependencies:
    - "build"
  services:
    - name: docker:20.10.16-dind
      alias: docker
      command: ["--tls=false", "--host=tcp://0.0.0.0:2375"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_AUTH_CONFIG: '{"auths":{"${CI_REGISTRY}":{"username":"${CI_DEPLOY_USER}","password":"${CI_DEPLOY_PASSWORD}"}}}'
  rules:
    # Only run tests if TEST_ENABLED is set
    - if: $TEST_ENABLED == "true" && $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ $ALLOWED_BRANCHES
      when: on_success
    - when: never
  script:
    - |
      set -e
      
      echo "=== Odoo Module Testing ==="
      
      # Install dependencies
      apk add --no-cache git openssh-client bash python3 py3-pip
      
      # Install manifestoo for co-dependency detection (if enabled)
      if [ "$TEST_INCLUDE_CODEPENDS" = "true" ]; then
        pip3 install --break-system-packages manifestoo || pip3 install manifestoo
      fi
      
      # Set up SSH for submodule access
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      cat > ~/.ssh/config << EOF
      Host github.com
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null
      Host git.bemade.org
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null
      EOF
      chmod 600 ~/.ssh/config
      cp "$SSH_KEY_GITHUB" ~/.ssh/github_key
      chmod 600 ~/.ssh/github_key
      eval $(ssh-agent -s)
      ssh-add ~/.ssh/github_key
      
      # Clone submodules (needed for module detection)
      git submodule update --init --recursive --recommend-shallow
      
      # Get odoo-ci scripts
      git clone git@git.bemade.org:bemade/odoo-ci.git
      
      # Detect changed modules
      echo "Detecting changed modules..."
      CODEPENDS_FLAG=""
      if [ "$TEST_INCLUDE_CODEPENDS" = "true" ]; then
        CODEPENDS_FLAG="--include-codepends"
      fi
      
      CHANGED_MODULES=$(python3 odoo-ci/scripts/detect_changed_modules.py \
        --addons-dir ./addons \
        --base-ref "${CI_COMMIT_BEFORE_SHA:-HEAD~1}" \
        --head-ref "${CI_COMMIT_SHA:-HEAD}" \
        --output comma \
        --verbose \
        $CODEPENDS_FLAG || echo "")
      
      if [ -z "$CHANGED_MODULES" ]; then
        echo "No Odoo modules changed - skipping tests"
        exit 0
      fi
      
      echo "Modules to test: $CHANGED_MODULES"
      
      # Login to Docker registry
      echo "${CI_DEPLOY_PASSWORD}" | docker login ${CI_REGISTRY} -u "${CI_DEPLOY_USER}" --password-stdin
      
      # Pull the test image
      docker pull "${CONTAINER_IMAGE}:test"
      
      # Set test database name
      TEST_DB="${TEST_DATABASE:-test_ci}"
      
      # Create a Docker network for test containers
      docker network create test-network || true
      
      # Start PostgreSQL container
      echo "Starting PostgreSQL..."
      docker run -d \
        --name test-db \
        --network test-network \
        -e POSTGRES_USER=odoo \
        -e POSTGRES_PASSWORD=odoo \
        -e POSTGRES_DB=postgres \
        postgres:15
      
      # Wait for PostgreSQL to be ready
      echo "Waiting for PostgreSQL..."
      for i in $(seq 1 30); do
        if docker exec test-db pg_isready -U odoo 2>/dev/null; then
          echo "PostgreSQL is ready"
          break
        fi
        echo "  waiting... ($i/30)"
        sleep 2
      done
      
      # Run Odoo tests
      # First, install modules without tests
      echo "Installing modules: $CHANGED_MODULES"
      docker run --rm \
        --network test-network \
        --entrypoint "" \
        "${CONTAINER_IMAGE}:latest" \
        /usr/bin/odoo \
        --db_host=test-db \
        --db_port=5432 \
        --db_user=odoo \
        --db_password=odoo \
        --database="$TEST_DB" \
        --addons-path="/mnt/extra-addons,/mnt/enterprise-addons,/usr/lib/python3/dist-packages/odoo/addons" \
        --init="$CHANGED_MODULES" \
        --stop-after-init \
        --log-level=error
      
      # Then run pytest-odoo for better reporting
      echo "Running pytest-odoo for: $CHANGED_MODULES"
      mkdir -p test-results
      docker run --rm \
        --network test-network \
        -e HOST=test-db \
        -e PORT=5432 \
        -e USER=odoo \
        -e PASSWORD=odoo \
        -v "$(pwd)/test-results:/test-results" \
        "${CONTAINER_IMAGE}:test" \
        pytest \
        --odoo-database="$TEST_DB" \
        --odoo-log-level=test \
        --junitxml=/test-results/junit.xml \
        --verbose \
        /mnt/extra-addons /mnt/enterprise-addons
      
      # Cleanup
      echo "Cleaning up..."
      docker stop test-db || true
      docker rm test-db || true
      docker network rm test-network || true
      
      echo "=== Tests completed successfully ==="
  artifacts:
    when: always
    paths:
      - test-results/
    expire_in: 1 week
  allow_failure: false

# Deploy stage will only run if KUBECTL_NAMESPACE and ODOO_INSTANCE_NAME are defined
deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  tags: [kubernetes]
  needs:
    - job: build
    - job: test
      optional: true  # Test job may be skipped if TEST_ENABLED is not set
  dependencies:
    - build
  rules:
    # Only deploy on staging branch when namespace and instance name are defined
    - if: $KUBECTL_NAMESPACE && $ODOO_INSTANCE_NAME && $STAGING_BRANCH == $CI_COMMIT_REF_NAME
      when: on_success
    # Default - don't deploy
    - when: never
  script:
    - |
      CONTAINER_IMAGE="${CONTAINER_IMAGE//:443/}"
      # Read the image digest from the file
      IMAGE_DIGEST=$(cat image-digest.txt)

      # Patch the OdooInstance custom resource with the new image
      kubectl patch odooinstance "${ODOO_INSTANCE_NAME}" \
        --namespace "${KUBECTL_NAMESPACE}" \
        --type merge \
        --patch "{\"spec\":{\"image\":\"${CONTAINER_IMAGE}@${IMAGE_DIGEST}\"}}"
