# Set ALLOWED_BRANCHES in your project's .gitlab-ci.yml to specify which branches should trigger this workflow
# Format: re2 regex, see https://github.com/google/re2 

variables:
  CONTAINER_IMAGE: "${CI_REGISTRY_IMAGE}/odoo-$CI_COMMIT_BRANCH"

stages:
  - build
  - test
  - deploy

# Reusable SSH setup for cloning odoo-ci and other repos
.setup_ssh: &setup_ssh
  - |
    mkdir -p ~/.ssh && chmod 700 ~/.ssh
    cat > ~/.ssh/config << EOF
    Host github.com
      StrictHostKeyChecking no
      UserKnownHostsFile=/dev/null
    Host git.bemade.org
      StrictHostKeyChecking no
      UserKnownHostsFile=/dev/null
    EOF
    chmod 600 ~/.ssh/config
    cp "$SSH_KEY_GITHUB" ~/.ssh/github_key
    chmod 600 ~/.ssh/github_key
    eval $(ssh-agent -s)
    ssh-add ~/.ssh/github_key

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ $ALLOWED_BRANCHES
      when: always
    - when: never

build:
  stage: build
  tags: [kubernetes]
  image: docker:20.10.16
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ $ALLOWED_BRANCHES
      when: always
    - when: never
  services:
    - name: docker:20.10.16-dind
      alias: docker
      command: ["--tls=false", "--host=tcp://0.0.0.0:2375"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DOCKER_AUTH_CONFIG: '{"auths":{"${CI_REGISTRY}":{"username":"${CI_DEPLOY_USER}","password":"${CI_DEPLOY_PASSWORD}"}}}'
  before_script:
    - apk add --no-cache git openssh-client bash shadow
    - *setup_ssh
    - git clone -b ${ODOO_CI_REF:-main} git@git.bemade.org:bemade/odoo-ci.git /tmp/odoo-ci
  script:
    - bash /tmp/odoo-ci/scripts/build.sh
    # Copy CI scripts for use in test stage
    - mkdir -p ci-scripts && cp /tmp/odoo-ci/scripts/odoo_log_to_junit.py ci-scripts/
  artifacts:
    paths:
      - image-digest.txt
      - changed-modules.txt
      - ci-scripts/
    expire_in: 1 hour

# Test stage - runs Odoo tests on changed modules
# Set TEST_ENABLED=true in your project's .gitlab-ci.yml to enable testing
# Set TEST_INCLUDE_CODEPENDS=true to also test modules that depend on changed modules
# Set TEST_DATABASE=<name> to specify test database name (default: test_ci)
test:
  stage: test
  tags: [kubernetes]
  image: ${CONTAINER_IMAGE}:test
  needs: ["build"]
  dependencies:
    - "build"
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_USER: odoo
    POSTGRES_PASSWORD: odoo
    POSTGRES_DB: odoo
    PGHOST: postgres
    PGUSER: odoo
    PGPASSWORD: odoo
    PGDATABASE: odoo
  rules:
    - if: $TEST_ENABLED == "true" && $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ $ALLOWED_BRANCHES
      when: on_success
    - when: never
  script:
    - |
      set -e
      echo "=== Odoo Module Testing ==="
      
      # Use OCA approach: test all installable addons in extra-addons
      ADDONS_DIR="/mnt/extra-addons"
      
      # List all installable addons using manifestoo
      ADDONS=$(manifestoo --select-addons-dir ${ADDONS_DIR} list --separator=,)
      
      if [ -z "$ADDONS" ]; then
        echo "No installable addons found - skipping tests"
        exit 0
      fi
      
      echo "Addons to test: $ADDONS"
      
      # Wait for PostgreSQL
      echo "Waiting for PostgreSQL..."
      oca_wait_for_postgres
      
      # OCA two-step approach:
      # 1. Install dependencies WITHOUT --test-enable (so their tests don't run)
      # 2. Install/upgrade our addons WITH --test-enable (only our tests run)
      
      # Step 1: Install dependencies only
      echo "Installing dependencies (without tests)..."
      DEPS=$(manifestoo --select-addons-dir ${ADDONS_DIR} list-depends --separator=,)
      echo "Dependencies: ${DEPS:-base}"
      unbuffer $(which odoo) \
        -d ${PGDATABASE} \
        -i ${DEPS:-base} \
        --addons-path=${ADDONS_PATH},${ADDONS_DIR} \
        --http-interface=127.0.0.1 \
        --stop-after-init 2>&1 | tee test-output.log | oca_checklog_odoo
      
      # Step 2: Run tests on our addons only
      echo "Running tests on our addons (full log in test-output.log)..."
      unbuffer coverage run --include "${ADDONS_DIR}/*" --branch \
        $(which odoo) \
        -d ${PGDATABASE} \
        -i ${ADDONS} \
        --addons-path=${ADDONS_PATH},${ADDONS_DIR} \
        --test-enable \
        --http-interface=127.0.0.1 \
        --stop-after-init 2>&1 | tee -a test-output.log | oca_checklog_odoo
      
      # Generate coverage report
      echo "=== Coverage Report ==="
      coverage report | tee -a test-output.log
      coverage xml -o coverage.xml
      coverage html -d htmlcov
      
      echo "=== Tests completed successfully ==="
  after_script:
    # Generate JUnit XML report from test log (script passed as artifact from build)
    - |
      if [ -f ci-scripts/odoo_log_to_junit.py ] && [ -f test-output.log ]; then
        python3 ci-scripts/odoo_log_to_junit.py test-output.log -o junit-report.xml
      else
        echo "JUnit report generation skipped - script or log not available"
      fi
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    when: always
    paths:
      - htmlcov/
      - coverage.xml
      - test-output.log
      - junit-report.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: junit-report.xml
    expire_in: 1 week
  allow_failure: false

# Deploy stage will only run if KUBECTL_NAMESPACE and ODOO_INSTANCE_NAME are defined
deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  tags: [kubernetes]
  needs:
    - job: build
    - job: test
      optional: true  # Test job may be skipped if TEST_ENABLED is not set
  dependencies:
    - build
  rules:
    # Only deploy on staging branch when namespace and instance name are defined
    - if: $KUBECTL_NAMESPACE && $ODOO_INSTANCE_NAME && $STAGING_BRANCH == $CI_COMMIT_REF_NAME
      when: on_success
    # Default - don't deploy
    - when: never
  script:
    - |
      CONTAINER_IMAGE="${CONTAINER_IMAGE//:443/}"
      # Read the image digest from the file
      IMAGE_DIGEST=$(cat image-digest.txt)

      # Patch the OdooInstance custom resource with the new image
      kubectl patch odooinstance "${ODOO_INSTANCE_NAME}" \
        --namespace "${KUBECTL_NAMESPACE}" \
        --type merge \
        --patch "{\"spec\":{\"image\":\"${CONTAINER_IMAGE}@${IMAGE_DIGEST}\"}}"
