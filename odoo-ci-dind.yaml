# Branch control variables (all are regex patterns):
#   BUILD_BRANCHES    - which branches trigger builds (falls back to ALLOWED_BRANCHES)
#   TEST_BRANCHES     - which branches run tests (no fallback, unset = no tests)
#   DEPLOY_BRANCHES   - which branches can deploy (no fallback, unset = no deploy)
#   MR_TARGET_BRANCHES - target branches whose MRs trigger build+test (no fallback, unset = no MR pipelines)
#   REVIEW_ENABLED    - set to "true" to deploy ephemeral review instances for MRs
#   ALLOWED_BRANCHES  - legacy, used as fallback for BUILD_BRANCHES
# Format: re2 regex, see https://github.com/google/re2

variables:
  # CI_COMMIT_BRANCH is set for push pipelines; CI_MERGE_REQUEST_SOURCE_BRANCH_NAME for MR pipelines
  CONTAINER_IMAGE: "${CI_REGISTRY_IMAGE}/odoo-${CI_COMMIT_BRANCH}${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"

stages:
  - build
  - test
  - deploy
  - cleanup

# Reusable SSH setup for cloning odoo-ci and other repos
.setup_ssh: &setup_ssh
  - |
    mkdir -p ~/.ssh && chmod 700 ~/.ssh
    cat > ~/.ssh/config << EOF
    Host github.com
      StrictHostKeyChecking no
      UserKnownHostsFile=/dev/null
    Host git.bemade.org
      StrictHostKeyChecking no
      UserKnownHostsFile=/dev/null
    EOF
    chmod 600 ~/.ssh/config
    cp "$SSH_KEY_GITHUB" ~/.ssh/github_key
    chmod 600 ~/.ssh/github_key
    eval $(ssh-agent -s)
    ssh-add ~/.ssh/github_key

workflow:
  rules:
    # MR pipelines: run when MR targets a matching branch
    - if: $MR_TARGET_BRANCHES && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MR_TARGET_BRANCHES
      when: always
    # Use BUILD_BRANCHES if set, otherwise fall back to ALLOWED_BRANCHES
    - if: $BUILD_BRANCHES && $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ $BUILD_BRANCHES
      when: always
    - if: $ALLOWED_BRANCHES && $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ $ALLOWED_BRANCHES
      when: always
    - when: never

build:
  stage: build
  tags: [kubernetes]
  image: docker
  # Stale builds for a superseded MR/branch commit are worthless once a newer
  # pipeline exists for the same ref — let auto-cancel kill them outright
  # rather than letting them run to completion and act on the cluster later.
  interruptible: true
  rules:
    # MR pipelines
    - if: $MR_TARGET_BRANCHES && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MR_TARGET_BRANCHES
      when: always
    # Use BUILD_BRANCHES if set, otherwise fall back to ALLOWED_BRANCHES
    - if: $BUILD_BRANCHES && $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ $BUILD_BRANCHES
      when: always
    - if: $ALLOWED_BRANCHES && $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ $ALLOWED_BRANCHES
      when: always
    - when: never
  # No docker:dind service: builds run against the persistent in-cluster
  # BuildKit daemon via the remote buildx driver (see scripts/build.sh and
  # kube-gitops/buildkit/). This drops a privileged sidecar and its per-job
  # startup, and keeps a warm layer cache across builds.
  variables:
    # NB: no DOCKER_AUTH_CONFIG. Registry auth for pull/push is handled by the
    # `docker login` in build.sh (forwarded to remote buildkitd per-build), and
    # the runner ServiceAccount's imagePullSecrets cover job/base image pulls.
    # The old malformed value ({"username":...,"password":...} instead of a
    # base64 "auth") only produced a recurring credential-store warning.
    #
    # Endpoint of the shared in-cluster BuildKit daemon (overridable per project).
    BUILDKIT_HOST: tcp://buildkitd.gitlab-runner.svc.cluster.local:1234
    # Full history so staging_diff.py can compute base...head and follow
    # submodule pointer bumps without "unknown revision" errors.
    GIT_DEPTH: "0"
  # Cache the submodule checkout in MinIO so warm builds delta-fetch instead of
  # full-cloning. We must cache BOTH the working trees (.repos/) AND the
  # superproject's submodule git dirs (.git/modules/): modern git stores each
  # submodule's real git data under .git/modules/ and leaves a gitlink file in
  # .repos/<sub>/.git pointing there. Caching .repos/ alone leaves those
  # gitlinks dangling on restore ("could not get a repository handle"), since
  # .git is freshly cloned each job. build.sh self-heals if the cache is stale.
  cache:
    key: "${CI_PROJECT_PATH_SLUG}-repos-v2"
    paths:
      - .repos/
      - .git/modules/
    policy: pull-push
  before_script:
    - apk add --no-cache git openssh-client bash shadow
    - *setup_ssh
    - git clone -b ${ODOO_CI_REF:-main} git@git.bemade.org:bemade/odoo-ci.git /tmp/odoo-ci
  script:
    - bash /tmp/odoo-ci/scripts/build.sh
    # Copy CI scripts for use in test stage
    - mkdir -p ci-scripts && cp /tmp/odoo-ci/scripts/odoo_log_to_junit.py /tmp/odoo-ci/scripts/filter_no_ci.py /tmp/odoo-ci/scripts/staging_diff.py ci-scripts/
    # List all project addons (directories with __manifest__.py) for review instances
    - ls -d addons/*/__manifest__.py 2>/dev/null | sed 's|addons/||;s|/__manifest__.py||' | tr '\n' ',' | sed 's/,$//' > project-addons.txt
    # Compute install/upgrade module list for downstream deploy/preview jobs.
    # For MRs: base = MR target branch (preview instance applies MR changes on top).
    # For *-staging pushes: base = branch minus "-staging".
    # Otherwise (push to any other branch, e.g. post-merge to a major version):
    #   base = CI_COMMIT_BEFORE_SHA (previous tip of this same branch).
    - |
      DIFF_BASE_REF=""
      DIFF_BASE_BRANCH=""
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        DIFF_BASE_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
        DIFF_BASE_REF="origin/${DIFF_BASE_BRANCH}"
      elif [ "${CI_COMMIT_BRANCH%-staging}" != "${CI_COMMIT_BRANCH}" ]; then
        DIFF_BASE_BRANCH="${CI_COMMIT_BRANCH%-staging}"
        DIFF_BASE_REF="origin/${DIFF_BASE_BRANCH}"
      elif [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        # Push to a regular branch: diff against this branch's previous tip.
        DIFF_BASE_REF="$CI_COMMIT_BEFORE_SHA"
      fi
      if [ -n "$DIFF_BASE_REF" ]; then
        apk add --no-cache python3
        if [ -n "$DIFF_BASE_BRANCH" ]; then
          git fetch --no-tags origin "+${DIFF_BASE_BRANCH}:refs/remotes/origin/${DIFF_BASE_BRANCH}"
        fi
        # build.sh inits submodules with --recommend-shallow; deepen each so
        # off-default-branch pointer SHAs from base resolve when diffing.
        # NB: fetch failures here used to be swallowed by a trailing `|| true`
        # with no log line - a silently-incomplete deepen is indistinguishable
        # from "no submodule changes" in the job log. Log every outcome instead
        # (2026-07-05 fitcrew-staging incident: modules:[] on a real submodule
        # bump, root cause never pinned down because nothing logged the fetch
        # step).
        git submodule foreach --recursive '
          echo "[staging-diff] deepening $name ...";
          if git fetch --unshallow --no-tags origin "+refs/heads/*:refs/remotes/origin/*" 2>&1; then
            echo "[staging-diff] $name: unshallow fetch OK";
          elif git fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*" 2>&1; then
            echo "[staging-diff] $name: already full history, plain fetch OK";
          else
            echo "[staging-diff] WARNING: $name: both deepen fetches FAILED - submodule diff for this submodule may be incomplete";
          fi
        '
        echo "[staging-diff] DIFF_BASE_REF=${DIFF_BASE_REF} DIFF_BASE_BRANCH=${DIFF_BASE_BRANCH} head=${CI_COMMIT_SHA}"
        python3 ci-scripts/staging_diff.py \
          --base "${DIFF_BASE_REF}" \
          --head "${CI_COMMIT_SHA}" \
          --verbose \
          -o staging-refresh.json
        cat staging-refresh.json
      else
        echo '{"base":null,"head":"'"${CI_COMMIT_SHA}"'","modules":[]}' > staging-refresh.json
        echo "No base ref (new branch or force-push) - empty staging-refresh.json."
      fi
  artifacts:
    paths:
      - image-digest.txt
      - changed-modules.txt
      - project-addons.txt
      - staging-refresh.json
      - ci-scripts/
    expire_in: 1 hour

# Test stage - runs Odoo tests on modules
# Set TEST_BRANCHES to a regex pattern of branches to test (e.g. "main|staging|19.0.*")
# If TEST_BRANCHES is not set, tests are skipped
test:
  stage: test
  tags: [kubernetes]
  image: ${CONTAINER_IMAGE}:test
  interruptible: true
  needs: ["build"]
  dependencies:
    - "build"
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_USER: odoo
    POSTGRES_PASSWORD: odoo
    POSTGRES_DB: odoo
    PGHOST: postgres
    PGUSER: odoo
    PGPASSWORD: odoo
    PGDATABASE: odoo
  rules:
    # MR pipelines: always test
    - if: $MR_TARGET_BRANCHES && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MR_TARGET_BRANCHES
      when: on_success
    - if: $TEST_BRANCHES && $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ $TEST_BRANCHES
      when: on_success
    - when: never
  script:
    - |
      set -e
      echo "=== Odoo Module Testing ==="
      
      # Use OCA approach: test all installable addons in extra-addons
      ADDONS_DIR="/mnt/extra-addons"
      
      # List all installable addons using manifestoo
      ALL_ADDONS=$(manifestoo --select-addons-dir ${ADDONS_DIR} list --separator=,)

      # Partition into testable and no_ci addons
      FILTER="${CI_PROJECT_DIR}/ci-scripts/filter_no_ci.py"
      REPO_DEPS="${CI_PROJECT_DIR}/repo_deps.yaml"
      if [ -f "$REPO_DEPS" ]; then
        TEST_ADDONS=$(python3 "$FILTER" "$ALL_ADDONS" "$REPO_DEPS" --emit testable || echo "$ALL_ADDONS")
        NO_CI_ADDONS=$(python3 "$FILTER" "$ALL_ADDONS" "$REPO_DEPS" --emit no_ci || true)
      else
        TEST_ADDONS="$ALL_ADDONS"
        NO_CI_ADDONS=""
      fi

      if [ -z "$TEST_ADDONS" ]; then
        echo "No testable addons found - skipping tests"
        exit 0
      fi

      echo "Addons to test: $TEST_ADDONS"
      [ -n "$NO_CI_ADDONS" ] && echo "no_ci addons (install only): $NO_CI_ADDONS"

      # Wait for PostgreSQL
      echo "Waiting for PostgreSQL..."
      oca_wait_for_postgres

      # Step 1: Install dependencies and no_ci addons WITHOUT tests.
      # no_ci addons must be installed so _inherit chains resolve.
      DEPS=$(manifestoo --select-addons-dir ${ADDONS_DIR} list-depends --separator=,)
      INSTALL_LIST="${DEPS:-base}"
      [ -n "$NO_CI_ADDONS" ] && INSTALL_LIST="${INSTALL_LIST},${NO_CI_ADDONS}"
      echo "Installing dependencies + no_ci addons (without tests)..."
      echo "Install list: ${INSTALL_LIST}"
      unbuffer $(which odoo) \
        -d ${PGDATABASE} \
        -i ${INSTALL_LIST} \
        --addons-path=${ADDONS_PATH},${ADDONS_DIR} \
        --http-interface=127.0.0.1 \
        --log-level=warn \
        --stop-after-init 2>&1 | tee test-output.log | oca_checklog_odoo

      # Step 2: Install and test only the non-excluded addons.
      # Coverage instrumentation (especially --branch) adds meaningful
      # runtime. The coverage report is only actioned on MRs (the MR widget
      # and diff annotations), so on push pipelines (post-merge, staging,
      # release) we run Odoo bare for a faster gate and skip the report.
      echo "Running tests on our addons (full log in test-output.log)..."
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        unbuffer coverage run --include "${ADDONS_DIR}/*" --branch \
          $(which odoo) \
          -d ${PGDATABASE} \
          -i ${TEST_ADDONS} \
          --addons-path=${ADDONS_PATH},${ADDONS_DIR} \
          --test-enable \
          --http-interface=127.0.0.1 \
          --log-level=warn \
          --stop-after-init 2>&1 | tee -a test-output.log | oca_checklog_odoo

        # Generate coverage report (MR pipelines only)
        echo "=== Coverage Report ==="
        coverage report | tee -a test-output.log
        coverage xml -o coverage.xml
        coverage html -d htmlcov
      else
        echo "Push pipeline - skipping coverage instrumentation."
        unbuffer $(which odoo) \
          -d ${PGDATABASE} \
          -i ${TEST_ADDONS} \
          --addons-path=${ADDONS_PATH},${ADDONS_DIR} \
          --test-enable \
          --http-interface=127.0.0.1 \
          --log-level=warn \
          --stop-after-init 2>&1 | tee -a test-output.log | oca_checklog_odoo
      fi

      echo "=== Tests completed successfully ==="
  after_script:
    # Generate JUnit XML report from test log (script passed as artifact from build)
    - |
      if [ -f ci-scripts/odoo_log_to_junit.py ] && [ -f test-output.log ]; then
        python3 ci-scripts/odoo_log_to_junit.py test-output.log -o junit-report.xml
      else
        echo "JUnit report generation skipped - script or log not available"
      fi
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    when: always
    paths:
      - htmlcov/
      - coverage.xml
      - test-output.log
      - junit-report.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: junit-report.xml
    expire_in: 1 week
  allow_failure: false

# Deploy stage - requires DEPLOY_BRANCHES to match and deploy config to be set
# Deploy config can come from:
#   1. KUBECTL_NAMESPACE + ODOO_INSTANCE_NAME variables (simple single-target)
#   2. .odoo-ci.yml config file (multi-target, branch-specific mappings)
deploy:
  stage: deploy
  image: alpine/k8s:1.29.0
  tags: [kubernetes]
  needs:
    - job: build
    - job: test
      optional: true  # Test job may be skipped if TEST_BRANCHES is not set
  dependencies:
    - build
  rules:
    # Use DEPLOY_BRANCHES if set
    - if: $DEPLOY_BRANCHES && $CI_COMMIT_BRANCH =~ $DEPLOY_BRANCHES
      when: on_success
    # Legacy: fall back to STAGING_BRANCH for backwards compatibility
    - if: $STAGING_BRANCH && $STAGING_BRANCH == $CI_COMMIT_REF_NAME
      when: on_success
    # Default - don't deploy
    - when: never
  before_script:
    # Install yq for parsing deploy targets config
    - |
      if [ -n "$DEPLOY_TARGETS" ] || [ -f .odoo-ci.yml ]; then
        apk add --no-cache yq
      fi
  script:
    - |
      set -e
      CONTAINER_IMAGE="${CONTAINER_IMAGE//:443/}"
      IMAGE_DIGEST=$(cat image-digest.txt)
      
      # Determine deploy target - check DEPLOY_TARGETS file variable first, then .odoo-ci.yml, then CI variables
      # DEPLOY_TARGETS is a GitLab file variable containing the path to a YAML file
      # Expected format:
      # targets:
      #   - branch-name:
      #       namespace: k8s-namespace
      #       instance: odoo-instance-name
      CONFIG_FILE=""
      if [ -n "$DEPLOY_TARGETS" ] && [ -f "$DEPLOY_TARGETS" ]; then
        CONFIG_FILE="$DEPLOY_TARGETS"
      elif [ -f .odoo-ci.yml ]; then
        CONFIG_FILE=".odoo-ci.yml"
      fi
      
      if [ -n "$CONFIG_FILE" ]; then
        DEPLOY_NAMESPACE=$(yq -r ".targets[] | select(has(\"${CI_COMMIT_BRANCH}\")) | .[\"${CI_COMMIT_BRANCH}\"].namespace" "$CONFIG_FILE" 2>/dev/null || echo "")
        DEPLOY_INSTANCE=$(yq -r ".targets[] | select(has(\"${CI_COMMIT_BRANCH}\")) | .[\"${CI_COMMIT_BRANCH}\"].instance" "$CONFIG_FILE" 2>/dev/null || echo "")
      fi
      
      # Fall back to CI variables if config file didn't provide values
      DEPLOY_NAMESPACE="${DEPLOY_NAMESPACE:-$KUBECTL_NAMESPACE}"
      DEPLOY_INSTANCE="${DEPLOY_INSTANCE:-$ODOO_INSTANCE_NAME}"
      
      if [ -z "$DEPLOY_NAMESPACE" ] || [ -z "$DEPLOY_INSTANCE" ]; then
        echo "ERROR: Deploy target not configured for branch ${CI_COMMIT_BRANCH}"
        echo "Set KUBECTL_NAMESPACE/ODOO_INSTANCE_NAME variables or add to .odoo-ci.yml"
        exit 1
      fi
      
      echo "Deploying to ${DEPLOY_NAMESPACE}/${DEPLOY_INSTANCE}"
      kubectl patch odooinstance "${DEPLOY_INSTANCE}" \
        --namespace "${DEPLOY_NAMESPACE}" \
        --type merge \
        --patch "{\"spec\":{\"image\":\"${CONTAINER_IMAGE}@${IMAGE_DIGEST}\"}}"

# Review deploy - spins up an ephemeral OdooInstance for MR review
# Set REVIEW_ENABLED=true to activate. Requires odoo-review namespace to exist.
review-deploy:
  stage: deploy
  image: alpine/k8s:1.29.0
  tags: [kubernetes]
  # A superseded MR commit's review-deploy must never win a race against the
  # head commit's review-deploy/review-stop — auto-cancel kills this job
  # outright once a newer pipeline exists for the same MR ref.
  interruptible: true
  needs:
    - job: build
      artifacts: true
    - job: test
      optional: true
  rules:
    - if: $REVIEW_ENABLED == "true" && $MR_TARGET_BRANCHES && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MR_TARGET_BRANCHES
      when: on_success
    - when: never
  environment:
    name: review/${CI_MERGE_REQUEST_IID}
    url: https://mr-${CI_MERGE_REQUEST_IID}-${CI_PROJECT_PATH_SLUG}.review.bemade.org
    on_stop: review-stop
  script:
    - apk add --no-cache curl jq
    - |
      set -e

      REVIEW_NS="odoo-review"
      INSTANCE_NAME="${CI_PROJECT_PATH_SLUG}-mr-${CI_MERGE_REQUEST_IID}"
      REVIEW_HOST="mr-${CI_MERGE_REQUEST_IID}-${CI_PROJECT_PATH_SLUG}.review.bemade.org"
      REVIEW_URL="https://${REVIEW_HOST}"
      CONTAINER_IMAGE="${CONTAINER_IMAGE//:443/}"

      # Pin by digest, not the mutable :test tag. OdooInstance pods default
      # to imagePullPolicy: IfNotPresent, so any node that has ever pulled
      # this tag before will keep serving its old cached image forever, no
      # matter how many times :test gets re-pushed - real content changes
      # silently never reach the cluster. build.sh already writes this
      # digest for the deploy job's same @digest patch; review-deploy just
      # never consumed it.
      if [ ! -f image-digest.txt ]; then
        echo "ERROR: image-digest.txt artifact from build job not found." >&2
        exit 1
      fi
      IMAGE_DIGEST=$(cat image-digest.txt)
      REVIEW_IMAGE="${CONTAINER_IMAGE}@${IMAGE_DIGEST}"

      # Build modules list from project-addons.txt, fall back to "base"
      MODULES_RAW=""
      if [ -f project-addons.txt ]; then
        MODULES_RAW=$(cat project-addons.txt | tr -d '[:space:]')
      fi
      if [ -n "$MODULES_RAW" ]; then
        # Convert comma-separated to JSON array: "a,b" -> "\"a\",\"b\""
        MODULES_JSON=$(echo "$MODULES_RAW" | tr ',' '\n' | sed 's/.*/"&"/' | tr '\n' ',' | sed 's/,$//')
      else
        MODULES_JSON='"base"'
      fi

      # Set addons_path based on enterprise vs community
      ADDONS_PATH="/mnt/extra-addons"
      if [ -z "$COMMUNITY" ]; then
        ADDONS_PATH="${ADDONS_PATH},/mnt/enterprise-addons"
      fi

      echo "Creating review instance: ${INSTANCE_NAME}"
      echo "  Host: ${REVIEW_HOST}"
      echo "  Modules: ${MODULES_JSON}"

      cat <<INSTANCE_EOF | kubectl apply -f -
      apiVersion: bemade.org/v1alpha1
      kind: OdooInstance
      metadata:
        name: ${INSTANCE_NAME}
        namespace: ${REVIEW_NS}
        labels:
          app.kubernetes.io/part-of: odoo-review
          review/mr-iid: "${CI_MERGE_REQUEST_IID}"
          review/project: "${CI_PROJECT_PATH_SLUG}"
      spec:
        image: "${REVIEW_IMAGE}"
        imagePullSecret: "registry.bemade.org"
        adminPassword: "review-admin"
        replicas: 1
        cron:
          replicas: 0
        init:
          enabled: true
          demo: true
          modules: [${MODULES_JSON}]
        database:
          cluster: "cnpg-1"
        filestore:
          storageSize: "1Gi"
        ingress:
          hosts:
            - "${REVIEW_HOST}"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        configOptions:
          addons_path: "${ADDONS_PATH}"
          workers: "2"
          limit_time_real: "1200"
          limit_time_cpu: "1200"
      INSTANCE_EOF

      # Post comment on the MR with the review URL
      MODULES_LIST=$(cat project-addons.txt 2>/dev/null || echo 'base')
      COMMENT_BODY=$(cat <<COMMENT_EOF
      ## Review Environment

      Instance **${INSTANCE_NAME}** is being provisioned.

      | | |
      |---|---|
      | URL | ${REVIEW_URL} |
      | Login | admin / admin |
      | Modules | ${MODULES_LIST} |

      Database initialization is running now — the \`review-wait\` job will post a follow-up comment once it's actually ready (or report why it failed).
      COMMENT_EOF
      )

      curl -s --request POST \
        --header "PRIVATE-TOKEN: ${CI_BOT_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "$(jq -n --arg body "$COMMENT_BODY" '{body: $body}')" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"

      # CR is applied, operator reconciles asynchronously. This job doesn't
      # block on readiness — review-wait (next job) polls and reports the
      # real outcome, so a slow boot doesn't fail *this* job for no reason.
      echo "Review instance CR applied. Operator will reconcile asynchronously."
      echo "Status: kubectl get odooinstance ${INSTANCE_NAME} -n ${REVIEW_NS}"

# Review wait - polls the OdooInstance created by review-deploy until it's
# actually Running (or InitFailed), and reports the real outcome on the MR.
# Bounded by REVIEW_READY_TIMEOUT_SECONDS (default 30 min; override per
# project for large module/demo-data sets) so a merely-slow boot doesn't
# hang the job forever — but a genuine init failure fails this job for real
# and attaches the init job's log as an artifact.
review-wait:
  stage: deploy
  image: alpine/k8s:1.29.0
  tags: [kubernetes]
  interruptible: true
  needs:
    - job: review-deploy
  rules:
    - if: $REVIEW_ENABLED == "true" && $MR_TARGET_BRANCHES && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MR_TARGET_BRANCHES
      when: on_success
    - when: never
  timeout: 45m
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - review-init.log
  script:
    - apk add --no-cache curl jq
    - |
      set -e

      REVIEW_NS="odoo-review"
      INSTANCE_NAME="${CI_PROJECT_PATH_SLUG}-mr-${CI_MERGE_REQUEST_IID}"
      REVIEW_URL="https://mr-${CI_MERGE_REQUEST_IID}-${CI_PROJECT_PATH_SLUG}.review.bemade.org"
      TIMEOUT_SECONDS="${REVIEW_READY_TIMEOUT_SECONDS:-1800}"
      POLL_INTERVAL=15
      ELAPSED=0

      post_comment() {
        curl -s --request POST \
          --header "PRIVATE-TOKEN: ${CI_BOT_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "$(jq -n --arg body "$1" '{body: $body}')" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" > /dev/null
      }

      dump_init_log() {
        POD=$(kubectl get pods -n "${REVIEW_NS}" \
          -l "bemade.org/instance=${INSTANCE_NAME},batch.kubernetes.io/job-name" \
          --sort-by=.metadata.creationTimestamp \
          -o jsonpath='{.items[*].metadata.name}' 2>/dev/null | tr ' ' '\n' | tail -1)
        if [ -n "$POD" ]; then
          kubectl logs -n "${REVIEW_NS}" "$POD" --all-containers --tail=2000 > review-init.log 2>&1 || true
        else
          echo "No init job pod found for ${INSTANCE_NAME} (already garbage-collected, TTL is 15m after completion)." > review-init.log
        fi
      }

      echo "Waiting for ${INSTANCE_NAME} to become ready (timeout ${TIMEOUT_SECONDS}s)..."

      while true; do
        if ! kubectl get odooinstance "${INSTANCE_NAME}" -n "${REVIEW_NS}" >/dev/null 2>&1; then
          echo "${INSTANCE_NAME} no longer exists (MR closed/merged and torn down) — nothing to report."
          exit 0
        fi

        PHASE=$(kubectl get odooinstance "${INSTANCE_NAME}" -n "${REVIEW_NS}" -o jsonpath='{.status.phase}' 2>/dev/null || echo "")

        if [ "$PHASE" = "Running" ]; then
          echo "${INSTANCE_NAME} is ready."
          post_comment "## Review Environment Ready

      **${INSTANCE_NAME}** finished initializing after ${ELAPSED}s and is up.

      ${REVIEW_URL}"
          exit 0
        fi

        if [ "$PHASE" = "InitFailed" ]; then
          echo "${INSTANCE_NAME} failed to initialize."
          dump_init_log
          # The operator never auto-retries a failed init job on respec (no
          # transition recreates it once InitFailed), so a stale instance
          # would otherwise sit broken forever, surviving every future push
          # to this MR. Delete it now so the next review-deploy starts
          # completely fresh with a real new init attempt.
          kubectl delete odooinstance "${INSTANCE_NAME}" -n "${REVIEW_NS}" --ignore-not-found --wait=false
          post_comment "## Review Environment Failed

      **${INSTANCE_NAME}** failed database initialization after ${ELAPSED}s and has been deleted.

      The init job's log is attached as an artifact on the \`review-wait\` job. Push a new commit to try again."
          exit 1
        fi

        if [ "$ELAPSED" -ge "$TIMEOUT_SECONDS" ]; then
          echo "Timed out waiting for ${INSTANCE_NAME} (still ${PHASE})."
          dump_init_log
          post_comment "## Review Environment Still Not Ready

      **${INSTANCE_NAME}** was still \`${PHASE}\` after ${ELAPSED}s. It may just be slow (large module/demo-data set) rather than broken — check ${REVIEW_URL} or \`kubectl get odooinstance ${INSTANCE_NAME} -n ${REVIEW_NS}\` directly. If this project's installs routinely take longer, raise \`REVIEW_READY_TIMEOUT_SECONDS\`."
          exit 1
        fi

        sleep "$POLL_INTERVAL"
        ELAPSED=$((ELAPSED + POLL_INTERVAL))
      done

# Review stop - tears down the ephemeral review instance when MR is closed/merged
review-stop:
  stage: cleanup
  image: alpine/k8s:1.29.0
  tags: [kubernetes]
  needs: []
  rules:
    - if: $REVIEW_ENABLED == "true" && $MR_TARGET_BRANCHES && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MR_TARGET_BRANCHES
      when: manual
      allow_failure: true
    - when: never
  environment:
    name: review/${CI_MERGE_REQUEST_IID}
    action: stop
  script:
    - apk add --no-cache curl jq
    - |
      set -e

      REVIEW_NS="odoo-review"
      INSTANCE_NAME="${CI_PROJECT_PATH_SLUG}-mr-${CI_MERGE_REQUEST_IID}"

      echo "Deleting review instance: ${INSTANCE_NAME}"
      kubectl delete odooinstance "${INSTANCE_NAME}" -n "${REVIEW_NS}" --ignore-not-found

      echo "=== Cleaning up MR container images ==="

      REPO_PATH="${CONTAINER_IMAGE#*/}"
      ENCODED_PATH=$(echo "$REPO_PATH" | sed 's|/|%2F|g')
      API_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories"

      REPO_ID=$(curl -s --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${API_URL}" | jq -r ".[] | select(.path == \"${REPO_PATH}\") | .id")

      if [ -n "$REPO_ID" ] && [ "$REPO_ID" != "null" ]; then
        echo "Deleting registry repository ${REPO_PATH} (ID: ${REPO_ID})..."
        curl -s --request DELETE --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${API_URL}/${REPO_ID}"
        echo "Image cleanup complete."
      else
        echo "Registry repository not found for ${REPO_PATH} - nothing to clean up."
      fi

      echo "Review environment cleanup complete."

# Upgrade modules - runs OdooUpgradeJob against the deployed instance based on
# the install/upgrade list precomputed by the build job (staging-refresh.json
# artifact). Skipped silently if the list is empty. Runs in the same
# conditions as `deploy` and only after it succeeds.
upgrade-modules:
  stage: deploy
  image: alpine/k8s:1.29.0
  tags: [kubernetes]
  needs:
    - job: build
      artifacts: true
    - job: deploy
  # No timeout in-script: rely on GitLab's job timeout (Settings → CI/CD →
  # General → Timeout) to bound the wait. Set it generously per project —
  # populated DBs with migrations can take hours.
  rules:
    - if: $DEPLOY_BRANCHES && $CI_COMMIT_BRANCH =~ $DEPLOY_BRANCHES
      when: on_success
    - if: $STAGING_BRANCH && $STAGING_BRANCH == $CI_COMMIT_REF_NAME
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache yq jq
  script:
    - |
      set -e

      if [ ! -f staging-refresh.json ]; then
        echo "staging-refresh.json artifact not found from build job - cannot proceed."
        exit 1
      fi
      cat staging-refresh.json

      # Resolve deploy target (mirrors logic in the deploy job).
      CONFIG_FILE=""
      if [ -n "$DEPLOY_TARGETS" ] && [ -f "$DEPLOY_TARGETS" ]; then
        CONFIG_FILE="$DEPLOY_TARGETS"
      elif [ -f .odoo-ci.yml ]; then
        CONFIG_FILE=".odoo-ci.yml"
      fi
      if [ -n "$CONFIG_FILE" ]; then
        DEPLOY_NAMESPACE=$(yq -r ".targets[] | select(has(\"${CI_COMMIT_BRANCH}\")) | .[\"${CI_COMMIT_BRANCH}\"].namespace" "$CONFIG_FILE" 2>/dev/null || echo "")
        DEPLOY_INSTANCE=$(yq -r ".targets[] | select(has(\"${CI_COMMIT_BRANCH}\")) | .[\"${CI_COMMIT_BRANCH}\"].instance" "$CONFIG_FILE" 2>/dev/null || echo "")
      fi
      DEPLOY_NAMESPACE="${DEPLOY_NAMESPACE:-$KUBECTL_NAMESPACE}"
      DEPLOY_INSTANCE="${DEPLOY_INSTANCE:-$ODOO_INSTANCE_NAME}"
      if [ -z "$DEPLOY_NAMESPACE" ] || [ -z "$DEPLOY_INSTANCE" ]; then
        echo "ERROR: Upgrade target not configured for branch ${CI_COMMIT_BRANCH}"
        exit 1
      fi

      MODULES_JSON=$(jq -c '.modules' staging-refresh.json)
      if [ "$MODULES_JSON" = "[]" ] || [ -z "$MODULES_JSON" ] || [ "$MODULES_JSON" = "null" ]; then
        echo "No modules to install or upgrade - skipping OdooUpgradeJob creation."
        exit 0
      fi

      JOB_NAME="upgrade-${CI_COMMIT_SHORT_SHA}-$(date +%s)"
      echo "Creating OdooUpgradeJob ${JOB_NAME} for ${DEPLOY_NAMESPACE}/${DEPLOY_INSTANCE}"
      echo "  modules: ${MODULES_JSON}"

      cat <<UJEOF | kubectl apply -f -
      apiVersion: bemade.org/v1alpha1
      kind: OdooUpgradeJob
      metadata:
        name: ${JOB_NAME}
        namespace: ${DEPLOY_NAMESPACE}
        labels:
          app.kubernetes.io/managed-by: gitlab-ci
          ci/commit-sha: "${CI_COMMIT_SHORT_SHA}"
          ci/pipeline-id: "${CI_PIPELINE_ID}"
      spec:
        odooInstanceRef:
          name: ${DEPLOY_INSTANCE}
        modules: ${MODULES_JSON}
        modulesInstall: ${MODULES_JSON}
      UJEOF

      # Poll for completion. The operator owns retries/backoff; CI just
      # waits. GitLab's job timeout bounds total runtime.
      while true; do
        PHASE=$(kubectl get odooupgradejob "${JOB_NAME}" -n "${DEPLOY_NAMESPACE}" -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
        echo "  phase=${PHASE:-(pending)}"
        case "$PHASE" in
          Completed)
            echo "OdooUpgradeJob completed successfully."
            exit 0
            ;;
          Failed)
            echo "OdooUpgradeJob failed:"
            kubectl describe odooupgradejob "${JOB_NAME}" -n "${DEPLOY_NAMESPACE}" || true
            exit 1
            ;;
        esac
        sleep 15
      done
  artifacts:
    when: always
    paths:
      - staging-refresh.json
    expire_in: 1 week

# Upgrade modules preview - on MR pipelines, posts (or updates) a sticky note
# on the MR showing which modules will be installed/upgraded if it merges.
# Pure-signal: no cluster mutation. Reads the precomputed staging-refresh.json
# artifact from the build job — no git, no submodules, no SSH needed here.
upgrade-modules-preview:
  stage: test
  image: alpine:latest
  tags: [kubernetes]
  interruptible: true
  needs:
    - job: build
      artifacts: true
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $MR_TARGET_BRANCHES && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MR_TARGET_BRANCHES
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache jq curl
  script:
    - |
      set -e

      if [ ! -f staging-refresh.json ]; then
        echo "staging-refresh.json artifact not found from build job - skipping preview."
        exit 0
      fi
      cat staging-refresh.json

      BASE_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
      HEAD="${CI_COMMIT_SHA}"
      MODULES=$(jq -r '.modules[]' staging-refresh.json)
      MARKER='<!-- upgrade-modules-preview -->'

      if [ -z "$MODULES" ]; then
        BODY="${MARKER}
      ## Module install/upgrade preview

      No modules touched relative to \`${BASE_BRANCH}\` — refreshing the deployed instance for this branch will be a no-op."
      else
        MOD_LIST=$(echo "$MODULES" | sed 's/^/- `/;s/$/`/')
        BODY="${MARKER}
      ## Module install/upgrade preview

      Merging this MR will run \`-i\` and \`-u\` for the following modules on the deployed target (Odoo no-ops the inapplicable one per module):

      ${MOD_LIST}

      _Computed from \`git diff ${BASE_BRANCH}...${HEAD:0:8}\` by \`scripts/staging_diff.py\`._"
      fi

      if [ -z "${CI_BOT_TOKEN:-}" ]; then
        echo "CI_BOT_TOKEN not set - skipping MR comment."
        echo "--- preview body ---"
        echo "$BODY"
        exit 0
      fi

      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
      EXISTING_ID=$(curl -s --header "PRIVATE-TOKEN: ${CI_BOT_TOKEN}" "${API}?per_page=100" \
        | jq -r --arg marker "$MARKER" '[.[] | select(.body | startswith($marker))] | (.[0].id // empty)')

      PAYLOAD=$(jq -n --arg body "$BODY" '{body: $body}')

      if [ -n "$EXISTING_ID" ]; then
        echo "Updating existing preview note ${EXISTING_ID}"
        curl -sf --request PUT \
          --header "PRIVATE-TOKEN: ${CI_BOT_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "$PAYLOAD" \
          "${API}/${EXISTING_ID}" > /dev/null
      else
        echo "Creating new preview note"
        curl -sf --request POST \
          --header "PRIVATE-TOKEN: ${CI_BOT_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "$PAYLOAD" \
          "${API}" > /dev/null
      fi
      echo "Done."
  artifacts:
    when: always
    paths:
      - staging-refresh.json
    expire_in: 1 week

# Cleanup stage - removes MR images from the container registry after build+test
cleanup:
  stage: cleanup
  image: alpine:latest
  tags: [kubernetes]
  needs:
    - job: test
      optional: true
  rules:
    # Skip when review is enabled — review-stop handles image cleanup
    - if: $REVIEW_ENABLED == "true"
      when: never
    - if: $MR_TARGET_BRANCHES && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MR_TARGET_BRANCHES
      when: always
    - when: never
  script:
    - apk add --no-cache curl jq
    - |
      set -e
      echo "=== Cleaning up MR container images ==="

      # Use GitLab registry API to find and delete the MR image repository
      # The registry repo path is derived from CONTAINER_IMAGE minus the registry host
      REPO_PATH="${CONTAINER_IMAGE#*/}"

      # URL-encode the repo path (slashes become %2F)
      ENCODED_PATH=$(echo "$REPO_PATH" | sed 's|/|%2F|g')

      API_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories"

      # Find the registry repository ID for this MR's image
      REPO_ID=$(curl -s --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${API_URL}" | jq -r ".[] | select(.path == \"${REPO_PATH}\") | .id")

      if [ -n "$REPO_ID" ] && [ "$REPO_ID" != "null" ]; then
        echo "Deleting registry repository ${REPO_PATH} (ID: ${REPO_ID})..."
        curl -s --request DELETE --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${API_URL}/${REPO_ID}"
        echo "Cleanup complete."
      else
        echo "Registry repository not found for ${REPO_PATH} - nothing to clean up."
      fi


# ---------------------------------------------------------------------------
# Release train (step 6 of the RC flow): on a daily SCHEDULE, MERGE the standing
# rc-<branch> -> <branch> MR (the "release PR" the task-worker accumulates) via
# the GitLab API. Release branches are PROTECTED — this merges, never pushes.
# Opt-in per project: set RELEASE_BRANCHES (e.g. "18.0 19.0") + RELEASE_TRAIN_TOKEN
# (a token allowed to merge into the protected release branches) + a daily
# scheduled pipeline. Unset RELEASE_BRANCHES = never runs.
# ---------------------------------------------------------------------------
release_train:
  stage: deploy
  tags: [kubernetes]
  image: alpine
  rules:
    - if: $RELEASE_BRANCHES && $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - when: never
  before_script:
    - apk add --no-cache git openssh-client bash curl jq
    - *setup_ssh
    - git clone -b ${ODOO_CI_REF:-main} git@git.bemade.org:bemade/odoo-ci.git /tmp/odoo-ci
  script:
    - bash /tmp/odoo-ci/scripts/release_train.sh

# Enforce the module-versioning convention: any module changed in an MR must
# bump its __manifest__.py version vs the target branch. Opt-in per project via
# the VERSION_BUMP_CHECK CI/CD variable ("true"). See
# https://github.com/bemade/pre-commit-hooks and odoo-project-guide §7.
version_bump_check:
  stage: test
  tags: [kubernetes]
  image: python:3.12-slim
  variables:
    GIT_DEPTH: 0  # full history so the merge-base for the diff is available
  rules:
    - if: $VERSION_BUMP_CHECK == "true" && $CI_PIPELINE_SOURCE == "merge_request_event" && $MR_TARGET_BRANCHES && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MR_TARGET_BRANCHES
      when: always
    - when: never
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - pip install --quiet "bemade-pre-commit-hooks @ git+https://github.com/bemade/pre-commit-hooks@v0.1.0"
  script:
    - git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - bemade-check-version-bump --against "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"

# Verify the vendored/ shared addons byte-match the commits pinned in addons.lock
# (per-addon vendoring integrity gate). Backward compatible: the job only exists
# when the repo has an addons.lock (rules:exists), so non-vendored projects are
# entirely unaffected. Re-fetches the pinned source repos, so it reuses the same
# github SSH key + git.bemade.org job-token auth the build uses for submodules.
vendor_check:
  stage: test
  tags: [kubernetes]
  image: python:3.12-slim
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - exists:
        - addons.lock
  before_script:
    - apt-get update -qq && apt-get install -y -qq git openssh-client >/dev/null
    - *setup_ssh
    # Reuse the CI job token for same-host (git.bemade.org) source repos, in both
    # https and ssh (git@host:) forms — mirrors build.sh's submodule auth so
    # private source repos on this GitLab are fetchable. github sources use the
    # SSH key loaded by *setup_ssh.
    - |
      if [ -n "${CI_JOB_TOKEN:-}" ] && [ -n "${CI_SERVER_HOST:-}" ]; then
        git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "https://${CI_SERVER_HOST}/"
        git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "git@${CI_SERVER_HOST}:"
      fi
    # Clone odoo-dev WITHOUT submodules and install from the local path. A
    # `pip install git+ssh://…odoo-dev` recurses submodules, and odoo-dev's
    # test-fixture submodule (tests/fixtures/odoo-empty) is a private repo the
    # client's CI job token can't reach (403). A non-recursive clone + local
    # install avoids that; the wheel only packages src/odoo_dev anyway. The
    # github SSH key loaded by *setup_ssh authorizes the clone.
    - git clone --depth 1 -b "${ODOO_DEV_REF:-master}" git@github.com:bemade/odoo-dev.git /tmp/odoo-dev
    - pip install --quiet /tmp/odoo-dev
  script:
    # Belt-and-suspenders with rules:exists — never fail a non-vendored repo.
    - |
      if [ ! -f addons.lock ]; then
        echo "No addons.lock at repo root — not vendored; skipping vendor check."
        exit 0
      fi
    - odoo-dev vendor check
