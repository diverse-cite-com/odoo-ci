# Set ALLOWED_BRANCHES in your project's .gitlab-ci.yml to specify which branches should trigger this workflow
# Format: re2 regex, see https://github.com/google/re2 

variables:
  # Strip :443 from registry URL to match pull secret configuration
  CONTAINER_IMAGE: "${CI_REGISTRY_IMAGE}/odoo-$CI_COMMIT_BRANCH"
stages:
  - build
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ $ALLOWED_BRANCHES
      when: always
    - when: never

build:
  stage: build
  tags: [kubernetes]
  image: docker:20.10.16
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ $ALLOWED_BRANCHES
      when: always
    - when: never
  services:
    - name: docker:20.10.16-dind
      alias: docker
      command: ["--tls=false", "--host=tcp://0.0.0.0:2375"]
  variables:
    # When using dind service, we need to instruct docker to talk with it
    DOCKER_HOST: tcp://docker:2375
    # These settings ensure docker can communicate with the dind service
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    # Pass registry credentials to Docker
    DOCKER_AUTH_CONFIG: '{"auths":{"${CI_REGISTRY}":{"username":"${CI_DEPLOY_USER}","password":"${CI_DEPLOY_PASSWORD}"}}}'
  script:
    - |
      set -x

      # Validate essential environment variables
      if [ -z "$CI_REGISTRY" ] || [ -z "$CI_DEPLOY_USER" ] || [ -z "$CI_DEPLOY_PASSWORD" ]; then
        echo "ERROR: Missing required Docker registry credentials"
        exit 1
      fi
      
      # Check docker is running or fail fast
      docker image ls

      # Login to Docker registry or fail fast
      echo "${CI_DEPLOY_PASSWORD}" | docker login ${CI_REGISTRY} -u "${CI_DEPLOY_USER}" --password-stdin
      
      # Install git and ssh
      apk add --no-cache git openssh-client bash shadow

      # Create a non-root user for better security
      addgroup -g 1000 builder
      adduser -D -u 1000 -G builder builder
      mkdir -p /home/builder
      chown -R builder:builder /home/builder

      # Set up SSH for GitHub access
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh

      # Configure SSH to not verify host keys
      cat > ~/.ssh/config << EOF
      Host github.com
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null

      Host git.bemade.org
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null
      EOF
      chmod 600 ~/.ssh/config

      # Add the SSH key - copy from the CI/CD variable
      cp "$SSH_KEY_GITHUB" ~/.ssh/github_key
      chmod 600 ~/.ssh/github_key
      eval $(ssh-agent -s)
      ssh-add ~/.ssh/github_key

      # Clone submodules
      git submodule update --init --recursive --recommend-shallow

      # Get the standard dockerfile
      git clone git@git.bemade.org:bemade/odoo-ci.git

      # Determine which dockerfile to use
      if [[ $COMMUNITY ]]; then
        dockerfile="odoo-ci/Dockerfile-community"
      else
        dockerfile="odoo-ci/Dockerfile"
      fi

      # Prepare the build context
      if [ -f ".odoo-deploy/odoo-ci/prepare-build.sh" ]; then
        bash .odoo-deploy/odoo-ci/prepare-build.sh
      fi

      # Convert symlinks in ./addons to full folders
      home="$(pwd)"
      if [ -d "./addons" ] && [ "$(ls -A ./addons)" ]; then
        mkdir -p ./addons-new \
        && cd ./addons-new \
        && find ../addons -type l \
          -exec sh -c 'target=$(readlink {}); link_name=$(basename {}); mv ${target#./} $link_name; rm {}' \;
      fi

      cd "$home"
      if [ -d "./addons-new" ] && [ "$(ls -A ./addons-new)" ]; then
        mv -f ./addons-new/* ./addons/ \
          && rm -rf addons-new
      fi

      # Set build date
      BUILD_DATE=$(date +%Y-%m-%d)


      # Build the Docker image with date and latest tags
      docker build \
        --no-cache \
        -f "${dockerfile}" \
        --build-arg ODOO_VERSION=${ODOO_VERSION} \
        --build-arg REGISTRY=${CI_REGISTRY} \
        -t "${CONTAINER_IMAGE}:${BUILD_DATE}" \
        -t "${CONTAINER_IMAGE}:latest" \
        .

      # Push the image with date and latest tags
      docker push "${CONTAINER_IMAGE}:${BUILD_DATE}"
      docker push "${CONTAINER_IMAGE}:latest" | tee push_output.txt

      grep "digest:" push_output.txt | cut -d' ' -f3 > image-digest.txt

  # Save the image digest as an artifact for the deploy job
  artifacts:
    paths:
      - image-digest.txt
    expire_in: 1 hour

# Deploy stage will only run if KUBECTL_NAMESPACE and ODOO_INSTANCE_NAME are defined
deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  tags: [kubernetes]
  needs: ["build"]  # Ensure build job runs first
  dependencies:
    - "build"  # Download artifacts from build job
  rules:
    # Only deploy on staging branch when namespace and instance name are defined
    - if: $KUBECTL_NAMESPACE && $ODOO_INSTANCE_NAME && $STAGING_BRANCH == $CI_COMMIT_REF_NAME
      when: on_success
    # Default - don't deploy
    - when: never
  script:
    - |
      CONTAINER_IMAGE="${CONTAINER_IMAGE//:443/}"
      # Read the image digest from the file
      IMAGE_DIGEST=$(cat image-digest.txt)

      # Patch the OdooInstance custom resource with the new image
      kubectl patch odooinstance "${ODOO_INSTANCE_NAME}" \
        --namespace "${KUBECTL_NAMESPACE}" \
        --type merge \
        --patch "{\"spec\":{\"image\":\"${CONTAINER_IMAGE}@${IMAGE_DIGEST}\"}}"
