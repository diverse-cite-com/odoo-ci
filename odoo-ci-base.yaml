image: moby/buildkit:latest

variables:
  DOCKER_DRIVER: overlay2
  CONTAINER_IMAGE: ${HARBOR_HOST}/bemade/${CI_PROJECT_NAMESPACE}-${CI_PROJECT_NAME}-${CI_COMMIT_BRANCH}
  BUILDKIT_PROGRESS: plain
  # Enable BuildKit features
  DOCKER_BUILDKIT: 1

stages:
  - build

build:
  stage: build
  before_script:
    # Set up SSH for GitHub access
    - apk add --no-cache openssh-client git bash
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Configure SSH to not verify host keys
    - |
      cat > ~/.ssh/config << EOF
      Host github.com
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null
      Host git.bemade.org
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null
      EOF
    - chmod 600 ~/.ssh/config
    # Add the SSH key
    - cp "$SSH_KEY_GITHUB" ~/.ssh/github_key
    - chmod 600 ~/.ssh/github_key
    - ssh-add ~/.ssh/github_key
    # Login to Docker registry
    - mkdir -p ~/.docker
    - echo '{"auths":{"'"$HARBOR_URL"'":{"username":"'"$HARBOR_USERNAME"'","password":"'"$HARBOR_PASSWORD"'"}}}' > ~/.docker/config.json
    # Clean up submodules directory if needed
    - rm -rf ./.repos/* 2>/dev/null || true
    # Update submodules
    - git submodule update --init --recursive
  script:
    - buildkitd --addr unix:///run/buildkit/buildkitd.sock &
    - sleep 5  # Give buildkitd time to start
    - export BUILD_DATE=$(date +%Y-%m-%d)
    # Use buildctl directly for more control
    - buildctl build --frontend=dockerfile.v0 --local context=. --local dockerfile=. --opt build-arg:ODOO_VERSION=${ODOO_VERSION} --opt filename:./Dockerfile --ssh default --output type=image,name=${CONTAINER_IMAGE}:${BUILD_DATE},push=true --output type=image,name=${CONTAINER_IMAGE}:latest,push=true
