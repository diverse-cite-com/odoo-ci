stages:
  - prepare
  - build

prepare:
  stage: prepare
  image: alpine:latest
  script:
    - apk add --no-cache git openssh-client
    # Set up SSH for GitHub access
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Configure SSH
    - |
      cat > ~/.ssh/config << EOF
      Host github.com
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null
      Host git.bemade.org
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null
      EOF
    - chmod 600 ~/.ssh/config
    # Add the SSH key
    - cp "$SSH_KEY_GITHUB" ~/.ssh/github_key
    - chmod 600 ~/.ssh/github_key
    - ssh-add ~/.ssh/github_key
    # Get the submodules and prepare the build context
    - git submodule update --init --recursive --recommend-shallow
    - git clone git@git.bemade.org:bemade/odoo-ci.git
    # Process the rest of your preparation steps...
    # Create a tar of the prepared context
    - tar -czf build-context.tar.gz .
    # Upload as artifact for the next stage
  artifacts:
    paths:
      - build-context.tar.gz

build_amd64:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$HARBOR_URL\":{\"username\":\"$HARBOR_USERNAME\",\"password\":\"$HARBOR_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - tar -xzf build-context.tar.gz
    - export BUILD_DATE=$(date +%Y-%m-%d)
    - |
      if [[ $COMMUNITY ]]; then
        dockerfile="odoo-ci/Dockerfile-community"
      else
        dockerfile="odoo-ci/Dockerfile"
      fi
    - /kaniko/executor 
      --context .
      --dockerfile "$dockerfile" 
      --build-arg ODOO_VERSION=${ODOO_VERSION}
      --destination ${CONTAINER_IMAGE}:${BUILD_DATE}
      --destination ${CONTAINER_IMAGE}:latest
  dependencies:
    - prepare