image: docker:latest

services:
  - name: docker:dind
    command: ["--tls=false"]

variables:
  # Use non-TLS connection since containers are in the same pod
  DOCKER_HOST: tcp://localhost:2375
  DOCKER_TLS_CERTDIR: ""  # Disable TLS
  DOCKER_DRIVER: overlay2
  CONTAINER_IMAGE: ${HARBOR_HOST}/bemade/${CI_PROJECT_NAMESPACE}-${CI_PROJECT_NAME}-${CI_COMMIT_BRANCH}

stages:
  - build

before_script:
  # Install required tools
  - apk add --no-cache git openssh-client
  # Set up SSH for GitHub access
  - eval $(ssh-agent -s)
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  # Configure SSH to not verify host keys
  - |
    cat > ~/.ssh/config << EOF
    Host github.com
      StrictHostKeyChecking no
      UserKnownHostsFile=/dev/null
    Host git.bemade.org
      StrictHostKeyChecking no
      UserKnownHostsFile=/dev/null
    EOF
  - chmod 600 ~/.ssh/config
  # Add the SSH key
  - cp "$SSH_KEY_GITHUB" ~/.ssh/github_key
  - chmod 600 ~/.ssh/github_key
  - ssh-add ~/.ssh/github_key
  # Install Docker Buildx
  - mkdir -p ~/.docker/cli-plugins
  - wget -O ~/.docker/cli-plugins/docker-buildx https://github.com/docker/buildx/releases/download/v0.10.4/buildx-v0.10.4.linux-amd64
  - chmod +x ~/.docker/cli-plugins/docker-buildx
  # Create and use a new builder instance
  - docker buildx create --use
  # Login to Docker registry
  - echo "$HARBOR_PASSWORD" | docker login $HARBOR_URL -u $HARBOR_USERNAME --password-stdin
  # Clean up submodules directory if it was set up by a previous run
  - rm -rf ./.repos/*

build_amd64:
  stage: build
  tags:
    - kubernetes
  script:
    # Get the submodules for extra-addons
    - git submodule update --init --recursive --recommend-shallow
    # Get the standard dockerfile
    - git clone git@git.bemade.org:bemade/odoo-ci.git
    - |
      if [[ $COMMUNITY ]]; then
        dockerfile="odoo-ci/Dockerfile-community"
      else
        dockerfile="odoo-ci/Dockerfile"
      fi
    # Convert symlinks in ./addons to full folders
    - home="$(pwd)"
    - |
      if [ -d "./addons" ] && [ "$(ls -A ./addons)" ]; then
        mkdir -p ./addons-new \
        && cd ./addons-new \
        && find ../addons -type l \
          -exec sh -c 'target=$(readlink {}); link_name=$(basename {}); mv ${target#./} $link_name; rm {}' \;
      fi
    - |
      cd "$home" && \
      if [ -d "./addons-new" ] && [ "$(ls -A ./addons-new)" ]; then
        mv -f ./addons-new/* ./addons/ \
          && rm -rf addons-new
      fi
    - export BUILD_DATE=$(date +%Y-%m-%d)
    - docker buildx build -f "$dockerfile" --build-arg ODOO_VERSION=${ODOO_VERSION} --platform linux/amd64 -t ${CONTAINER_IMAGE}:${BUILD_DATE} -t ${CONTAINER_IMAGE}:latest --push .

after_script:
  - docker buildx rm
  - rm -rf ~/.ssh
  - rm -rf artifacts/
