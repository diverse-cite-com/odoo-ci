image: moby/buildkit:rootless

variables:
  DOCKER_DRIVER: overlay2
  CONTAINER_IMAGE: ${HARBOR_HOST}/bemade/${CI_PROJECT_NAMESPACE}-${CI_PROJECT_NAME}-${CI_COMMIT_BRANCH}
  BUILDKIT_PROGRESS: plain
  # Enable BuildKit features
  DOCKER_BUILDKIT: 1
  BUILDKITD_FLAGS: --oci-worker-no-process-sandbox

stages:
  - build

build:
  stage: build
  before_script:
    # Set up SSH for GitHub access
    - apk add --no-cache openssh-client git bash
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Configure SSH to not verify host keys
    - |
      cat > ~/.ssh/config << EOF
      Host github.com
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null
      Host git.bemade.org
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null
      EOF
    - chmod 600 ~/.ssh/config
    # Add the SSH key
    - cp "$SSH_KEY_GITHUB" ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    # Configure Git to use the SSH key
    - eval $(ssh-agent)
    - ssh-add ~/.ssh/id_rsa
    # Get the submodules for extra-addons
    - git submodule update --init --recursive --recommend-shallow
    # Get the standard dockerfile
    - git clone git@git.bemade.org:bemade/odoo-ci.git
    # Convert symlinks in ./addons to full folders
    - home="$(pwd)"
    - |
      if [ -d "./addons" ] && [ "$(ls -A ./addons)" ]; then
        mkdir -p ./addons-new \
        && cd ./addons-new \
        && find ../addons -type l \
          -exec sh -c 'target=$(readlink {}); link_name=$(basename {}); mv ${target#./} $link_name; rm {}' \;
      fi
    - |
      cd "$home" && \
      if [ -d "./addons-new" ] && [ "$(ls -A ./addons-new)" ]; then
        mv -f ./addons-new/* ./addons/ \
          && rm -rf addons-new
      fi
    # Set up the dockerfile path for enterprise/community
    - |
      if [[ $COMMUNITY ]]; then
        dockerfile="odoo-ci/Dockerfile-community"
      else
        dockerfile="odoo-ci/Dockerfile"
      fi
    # Create a minimal build context with only what's needed
    - mkdir -p /workspace
    - cp -r addons /workspace/
    - cp requirements.txt /workspace/ || echo "No requirements.txt found"
    - cp "$dockerfile" /workspace/Dockerfile

build_amd64:
  stage: build
  needs:
    - prepare
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    # Configure Docker registry credentials
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$HARBOR_URL\":{\"username\":\"$HARBOR_USERNAME\",\"password\":\"$HARBOR_PASSWORD\"}}}" > /kaniko/.docker/config.json
    # Set the build date
    - export BUILD_DATE=$(date +%Y-%m-%d)
    # Build and push the image
    - /kaniko/executor
      --context=/workspace
      --dockerfile=/workspace/Dockerfile
      --build-arg ODOO_VERSION=${ODOO_VERSION}
      --destination ${CONTAINER_IMAGE}:${BUILD_DATE}
      --destination ${CONTAINER_IMAGE}:latest
