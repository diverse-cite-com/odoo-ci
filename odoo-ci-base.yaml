image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_DRIVER: overlay2
  CONTAINER_IMAGE: ${HARBOR_HOST}/bemade/odoo${ODOO_VERSION}e-${CI_PROJECT_NAMESPACE}-${CI_PROJECT_NAME}

stages:
  - build

# This before_script section will be used by all jobs
before_script:
  # Set up SSH for GitHub access
  - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
  - eval $(ssh-agent -s)
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  # Configure SSH to not verify host keys for both GitHub and git.bemade.org
  - |
    cat > ~/.ssh/config << EOF
    Host github.com
      StrictHostKeyChecking no
      UserKnownHostsFile=/dev/null

    Host git.bemade.org
      StrictHostKeyChecking no
      UserKnownHostsFile=/dev/null
    EOF
  - chmod 600 ~/.ssh/config
  # Add the SSH key - copy to a temporary file with proper permissions
  - cp "$SSH_KEY_GITHUB" ~/.ssh/github_key
  - chmod 600 ~/.ssh/github_key
  - ssh-add ~/.ssh/github_key
  # Login to Docker registry
  - echo "$HARBOR_PASSWORD" | docker login $HARBOR_URL -u $HARBOR_USERNAME --password-stdin
  # Clean up submodules directory if it was set up by a previous run
  - rm -rf ./.repos/*

build_amd64:
  stage: build
  tags:
    - docker
  script:
    # Get the submodules for extra-addons
    - git submodule update --init --recursive --recommend-shallow
    # Get the standard dockerfile
    - git clone git@git.bemade.org:bemade/odoo-ci.git
    - cp odoo-ci/Dockerfile .
    # Convert symlinks in ./addons to full folders
    - home="$(pwd)"
    - |
      if [ -d "./addons" ] && [ "$(ls -A ./addons)" ]; then
        mkdir -p ./addons-new \
        && cd ./addons-new \
        && find ../addons -type l \
          -exec sh -c 'target=$(readlink {}); link_name=$(basename {}); mv ${target#./} $link_name; rm {}' \;
      fi
    - |
      cd "$home" && \
      if [ -d "./addons-new" ] && [ "$(ls -A ./addons-new)" ]; then
        mv -f ./* ../addons/ \
          && cd .. \
          && rm -rf addons-new
      fi
    - export BUILD_DATE=$(date +%Y-%m-%d)
    - docker buildx build --build-arg ODOO_VERSION=${ODOO_VERSION} --platform linux/amd64 -t ${CONTAINER_IMAGE}:${BUILD_DATE} -t ${CONTAINER_IMAGE}:latest --push .

after_script:
  - docker system prune -af --volumes
  - rm -rf ~/.ssh
  - rm -rf artifacts/
