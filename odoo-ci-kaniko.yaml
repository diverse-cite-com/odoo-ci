variables:
  CUSTOM_KANIKO_IMAGE: ${HARBOR_HOST}/bemade/kaniko-ssh:latest
  CONTAINER_IMAGE: ${HARBOR_HOST}/bemade/${CI_PROJECT_NAMESPACE}-${CI_PROJECT_NAME}-${CI_COMMIT_BRANCH}

stages:
  - build

build:
  stage: build
  tags: [kubernetes]
  image:
    name: ${CUSTOM_KANIKO_IMAGE}
    entrypoint: ["/bin/sh", "-c"]
  variables:
    # Pass CI registry credentials to Kaniko
    DOCKER_AUTH_CONFIG: '{"auths":{"${HARBOR_URL}":{"username":"${HARBOR_USERNAME}","password":"${HARBOR_PASSWORD}"}}}'
  script:
    - |
      # Set up SSH for GitHub access
      mkdir -p /kaniko/.ssh
      chmod 700 /kaniko/.ssh

      # Configure SSH to not verify host keys
      cat > /kaniko/.ssh/config << EOF
      Host github.com
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null

      Host git.bemade.org
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null
      EOF
      chmod 600 /kaniko/.ssh/config

      # Add the SSH key
      cp "$SSH_KEY_GITHUB" /kaniko/.ssh/github_key
      chmod 600 /kaniko/.ssh/github_key

      # Set up SSH agent
      eval $(ssh-agent -s)
      ssh-add /kaniko/.ssh/github_key

      # Get the submodules for extra-addons
      git submodule update --init --recursive --recommend-shallow

      # Get the standard dockerfile
      git clone git@git.bemade.org:bemade/odoo-ci.git
      
      if [[ $COMMUNITY ]]; then
        dockerfile="odoo-ci/Dockerfile-community"
      else
        dockerfile="odoo-ci/Dockerfile"
      fi

      # Convert symlinks in ./addons to full folders
      home="$(pwd)"
      if [ -d "./addons" ] && [ "$(ls -A ./addons)" ]; then
        mkdir -p ./addons-new \
        && cd ./addons-new \
        && find ../addons -type l \
          -exec sh -c 'target=$(readlink {}); link_name=$(basename {}); mv ${target#./} $link_name; rm {}' \;
      fi

      cd "$home"
      if [ -d "./addons-new" ] && [ "$(ls -A ./addons-new)" ]; then
        mv -f ./addons-new/* ./addons/ \
          && rm -rf addons-new
      fi

      # Set build date
      BUILD_DATE=$(date +%Y-%m-%d)
      
      # Run Kaniko executor
      /kaniko/executor \
        --context="${CI_PROJECT_DIR}" \
        --dockerfile="${dockerfile}" \
        --build-arg="ODOO_VERSION=${ODOO_VERSION}" \
        --destination="${CONTAINER_IMAGE}:${BUILD_DATE}" \
        --destination="${CONTAINER_IMAGE}:latest" \
        --cleanup